<!doctype html>
<!-- Replay of a real /mama-send run on the fictional demo data (fake transport: nothing leaves the machine).
     Frames are captured by docs/assets/src/tour.mjs-style stepping: window.render(seconds). -->
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500;600&display=block" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; }
  body { width: 1280px; height: 800px; background: #F6F4FF; font-family: Geist, system-ui, sans-serif; padding: 28px 36px; display: flex; flex-direction: column; gap: 16px; overflow: hidden; }
  .top { display: flex; align-items: center; gap: 12px; }
  .logo { width: 40px; height: 40px; border-radius: 11px; background: #16131F; color: #C8F031; display: grid; place-items: center; font: 800 17px 'Bricolage Grotesque'; }
  .brand { font: 700 22px 'Bricolage Grotesque'; color: #16131F; }
  .pill { margin-left: auto; font: 600 13px Geist; padding: 7px 14px; border-radius: 999px; background: #FFEDE0; color: #9A3412; }
  .pill.g { margin-left: 0; background: #E2F6E8; color: #15803D; }
  .term { flex: 1; background: #16131F; border-radius: 22px; overflow: hidden; display: flex; flex-direction: column; box-shadow: 0 30px 60px -30px rgba(22,19,31,.5); }
  .bar { display: flex; align-items: center; gap: 8px; padding: 12px 18px; border-bottom: 1px solid #2E2940; color: #8A84A3; font: 500 13px 'Geist Mono'; }
  .dot { width: 11px; height: 11px; border-radius: 50%; background: #3A3450; }
  .screen { flex: 1; display: flex; flex-direction: column; justify-content: flex-end; padding: 16px 22px 18px; overflow: hidden; }
  .ln { font: 400 14.5px/1.55 'Geist Mono', monospace; color: #E9E6F2; white-space: pre-wrap; }
  .you { color: #fff; font-weight: 600; } .you::before { content: '❯ '; color: #C8F031; }
  .tool { color: #8A84A3; } .tool::before { content: '● '; color: #C4B5FD; }
  .mama { color: #fff; font-family: Geist, sans-serif; font-size: 16px; margin: 4px 0; } .mama::before { content: 'Mama ▸ '; color: #C8F031; font-weight: 700; }
  .q { color: #C4B5FD; } .m { color: #8A84A3; } .ok { color: #86EFAC; font-weight: 600; } .c { color: #C8F031; }
  .ask { margin: 8px 0; border: 1.5px solid #C8F031; border-radius: 14px; padding: 12px 16px; display: flex; align-items: center; gap: 14px; font: 500 15px Geist; color: #E9E6F2; }
  .ask code { font: 500 13.5px 'Geist Mono'; color: #C8F031; }
  .btn { margin-left: auto; padding: 7px 16px; border-radius: 999px; font: 700 14px Geist; background: #2E2940; color: #E9E6F2; }
  .btn.on { background: #C8F031; color: #16131F; transform: scale(.96); }
  .btn.no { margin-left: 0; }
  .caret { display: inline-block; width: 8px; height: 17px; background: #C8F031; vertical-align: -3px; }
</style></head>
<body>
  <div class="top"><span class="logo">SM</span><span class="brand">Sales Mama · send review</span>
    <span class="pill">demo data · fake transport, nothing leaves the machine</span><span class="pill g">sending on</span></div>
  <div class="term"><div class="bar"><i class="dot"></i><i class="dot"></i><i class="dot"></i>&nbsp; claude · sales-mama.ai</div>
    <div class="screen" id="screen"></div></div>
<script>
const D = {"preview": ["Preview 20261102-204550-mei · sending on · quota left today: 15", "", "[1] READY · email · harbourlight-foods · first · to rachel@harbourlightfoods.example", "    Subject: Your Tampines kitchen", "    | Hi Rachel,", "    | ", "    | I saw Harbourlight Foods has a second kitchen opening in Tampines. IT Care covers helpdesk, device setup and backups for both kitchens.", "    | ", "    | Worth a 15-minute call?", "    | ", "    | Mei Chen", "    | Account Executive, Example Co (fictional)", "    | ", "    | Reply \"unsubscribe\" and I won't email you again.", "", "[2] READY · whatsapp · lantern-lane-bakery · first · to +6598765432", "    Template: first_new_branch", "    | Hi Daniel, congratulations on the new Jurong outlet. We get lines, WiFi and devices ready on day one, so a new site needs no IT project. Worth a 15-minute call? Reply STOP to opt out.", "", "To send, approve: python3 scripts/send.py --send 20261102-204550-mei --items 1,2"], "send": ["[1] sent · gmail:fake-b0a22683fbf6", "[2] sent · wa:wamid.fake-cf0cd2b76138"], "touches": ["2026-11-03 09:42,mei,harbourlight-foods,rachel-goh-harbourlight-foods,email,first,first-test,it-care,sent,,gmail:fake-b0a22683fbf6", "2026-11-03 09:42,mei,lantern-lane-bakery,daniel-lim-lantern-lane-bakery,whatsapp,first,first-test,it-care,sent,,wa:wamid.fake-cf0cd2b76138"], "pid": "20261102-204550-mei", "items": "1,2"};
const esc = s => s.replace(/&/g,'&amp;').replace(/</g,'&lt;');
function colour(l) {
  let e = esc(l);
  if (e.startsWith('Preview')) return '<span class="m">' + e + '</span>';
  e = e.replace('READY', '<span class="ok">READY</span>').replace(/^(\[\d\]) sent/, '$1 <span class="ok">sent</span>');
  if (e.trim().startsWith('|') || e.trim().startsWith('Subject') || e.trim().startsWith('Template')) return '<span class="q">' + e + '</span>';
  if (e.startsWith('To send')) return '<span class="c">' + e + '</span>';
  return e;
}
// timeline: [start, kind, text, extra]
const T = []; let t = 0.4;
const type = (cls, text, cps) => { T.push([t, 'type', text, cls, cps]); t += text.length / cps + 0.5; };
const line = (cls, html, dt) => { T.push([t, 'line', html, cls]); t += dt; };
type('you', '/mama-send', 9);
line('tool', 'Running python3 scripts/send.py --preview', 0.7);
D.preview.filter(l => l.trim() !== '|').forEach(l => line('ln', colour(l), 0.09));
t += 2.2;
line('mama', '2 ready: email to Rachel at Harbourlight Foods, WhatsApp to Daniel at Lantern Lane Bakery. Send both?', 1.4);
type('you', 'send 1, 2', 8);
const askAt = t; line('ask', '', 1.6); const clickAt = askAt + 1.1;
line('tool', 'Running python3 scripts/send.py --send ' + D.pid + ' --items ' + D.items, 0.8);
D.send.filter(l => l.trim()).forEach(l => line('ln', colour(l), 0.45));
line('tool', 'log/touches.csv', 0.3);
D.touches.forEach(l => line('ln m', esc(l), 0.3));
t += 0.3;
line('mama', 'Sent 2 · Harbourlight Foods (email) · Lantern Lane Bakery (WhatsApp). Logged in approvals.csv and touches.', 3.0);
window.DURATION = t;
window.render = function (now) {
  const out = [];
  for (const [st, kind, text, cls, cps] of T) {
    if (now < st) break;
    if (kind === 'type') {
      const n = Math.min(text.length, Math.floor((now - st) * cps));
      out.push('<div class="ln ' + cls + '">' + esc(text.slice(0, n)) + (n < text.length ? '<span class="caret"></span>' : '') + '</div>');
    } else if (cls === 'ask') {
      const on = now >= clickAt;
      out.push('<div class="ask">Allow <code>python3 scripts/send.py --send ' + D.pid + ' --items ' + D.items + '</code>?' +
               '<span class="btn ' + (on ? 'on' : '') + '">' + (on ? 'Approved' : 'Yes') + '</span><span class="btn no">No</span></div>');
    } else {
      out.push('<div class="ln ' + cls + '">' + text + '</div>');
    }
  }
  document.getElementById('screen').innerHTML = out.join('');
};
render(0);
</script></body></html>
