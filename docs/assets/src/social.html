<!doctype html>
<!-- GitHub social preview (1280 × 640, under 1 MB). Upload in repo Settings → General → Social preview. -->
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=Geist:wght@400;500;600&family=Geist+Mono:wght@500&display=block" rel="stylesheet">
<style>
  :root { --ink:#16131F; --lime:#C8F031; }
  * { margin: 0; box-sizing: border-box; }
  body { width: 1280px; height: 640px; background: var(--ink); color: #fff; font-family: Geist, system-ui, sans-serif; overflow: hidden; position: relative; }
  .left { position: absolute; left: 80px; top: 72px; width: 640px; display: flex; flex-direction: column; gap: 26px; }
  .brand { display: flex; align-items: center; gap: 18px; font: 700 34px 'Bricolage Grotesque'; }
  .logo { width: 72px; height: 72px; border-radius: 18px; background: var(--lime); color: var(--ink); display: grid; place-items: center; font: 800 32px 'Bricolage Grotesque'; letter-spacing: -1px; }
  h1 { font: 800 66px/1.02 'Bricolage Grotesque'; letter-spacing: -2px; }
  h1 em { font-style: normal; color: var(--lime); }
  p { font: 400 23px/1.45 Geist; color: #C9C4DA; }
  .meta { font: 500 18px 'Geist Mono'; color: #8A84A3; }
  .meta b { color: var(--lime); font-weight: 500; }
  .desk { position: absolute; left: 760px; top: 70px; width: 720px; height: 500px; border-radius: 24px; overflow: hidden; border: 1px solid #2E2940; }
  .desk img { width: 100%; height: 100%; object-fit: cover; object-position: 0 0; display: block; }
</style></head>
<body>
  <div class="left">
    <div class="brand"><span class="logo">SM</span>Sales Mama</div>
    <h1>The AI sales teammate that sends <em>only what you approve.</em></h1>
    <p>Researches, scores and writes outreach for small B2B teams in Singapore, Malaysia and India. Runs inside Claude Code.</p>
    <div class="meta"><b>neam-lang/sales-mama.ai</b> · Gmail · WhatsApp</div>
  </div>
  <div class="desk"><img src="../screens/manager-wide.jpg" alt=""></div>
</body></html>
