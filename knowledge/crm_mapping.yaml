# CRM export column → account field. Set for the demo export (fictional, ADR-0005); re-check against the real export.
export:
  "Account Name": name
  "Country": market            # map to SG | MY | IN
  "Registration No": reg_id    # UEN / SSM no. / CIN or LLPIN
  "GSTIN": alt_ids.gstin       # India, optional
  "City": city
  "Website": domain
  "Industry": industry
  "Employees": employees
  "Products": products_owned   # split on ";" → product ids
  "Contract End": contract_end
  "Parent Account": group      # continuity in allocation
  "NPTB Score": propensity     # optional prior, 0–1 after normalising
date_formats: ["%Y-%m-%d", "%d/%m/%Y"]
industry_values:               # CRM value → ontology term
  "Food & Beverage": fnb
  "Retail": retail
  "Logistics": logistics
  "Healthcare": clinics
  "Professional Services": professional_services
  "Education": education
product_values:                # CRM value → product id
  "Cloud Phone": cloud-phone
  "Managed WiFi": managed-wifi
  "IT Care": it-care
country_values: {Singapore: SG, Malaysia: MY, India: IN}
import:                        # columns for log/crm-updates/<date>.csv
  - "Account Name"
  - "Stage"
  - "Next Step"
  - "Owner Email"
  - "Notes"
