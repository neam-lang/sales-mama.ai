# Postal sectors (first 2 digits) the open point data covers thinly: weights over planning areas.
# Used only for companies whose exact postal code is not in the point data (spec §4.1). Values are
# ESTIMATES from the public URA postal-district list and local knowledge: check them against OneMap
# when a token is available (build_geo.py check --onemap) and correct here. Weights per sector sum to 1.
# Area ids are the slugs in sg_planning_areas.geojson. Sectors 00 and 91 are invalid codes: left unplaced.
