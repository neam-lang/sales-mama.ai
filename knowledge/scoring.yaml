# Lead score (0–1) — used by scripts/score.py (Phase 3). See PLAN.md §8.
weights: {fit: 0.30, intent: 0.50, propensity: 0.10, engagement: 0.10}   # intent-heavier (Phase 1 interview)
# fit is scored against the account's own market section in icp.md; unknown values get `unknown` x part
fit: {industry_match: 0.4, size_in_range: 0.3, region_match: 0.1, owns_prerequisite: 0.2, unknown: 0.5}
intent:                       # sum over terms of max(signal.weight x trust x decay(age)), capped at 1
  decay: exponential          # half-life = decay_days / 2 from ontology.yaml
  trust: {crm: 1.0, research: 0.8, default: 0.5}   # raw/signals/<date>/<source>/ uses sources.yaml trust
propensity: {missing: 0.0}    # CRM NPTB prior (0-1); value used when the account has none
engagement: {replied: 0.6, meeting: 1.0, no_reply_after_3: -0.3}
tiers: {A: 0.70, B: 0.45}      # below B → C
hot_alert: {score_jump: 0.20}
